services:
  backend:
    build: ./src/backend
    container_name: backend
    volumes:
      - ./src/backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./src/backend/.env

  frontend:
    build: ./src/frontend
    container_name: frontend
    volumes:
      - ./src/frontend:/app
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    env_file:
      - .env
    depends_on:
      - backend
